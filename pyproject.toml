[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-audit"
version = "0.1.0"
description = "Explain any model, audit it for bias, and generate the model card."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.46",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
model-audit = "model_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
